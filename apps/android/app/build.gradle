apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Isolated laboratory builds accept a locally built, untracked AAR.
def labAar = providers.gradleProperty('nexusV2Aar').orNull
def publicVersion = '1.0.1'
def components = publicVersion.tokenize('.').collect { Integer.parseInt(it) }
assert components.size() == 3 && components[1] < 100 && components[2] < 100
def numericVersion = components[0] * 10000 + components[1] * 100 + components[2]
def signingInput = { key -> providers.environmentVariable(key).orElse(providers.gradleProperty(key)).orNull }
def signingKeys = ['NEXUS_KEYSTORE', 'NEXUS_KEYSTORE_PASSWORD', 'NEXUS_KEY_ALIAS', 'NEXUS_KEY_PASSWORD']
def sign = signingKeys.collectEntries { [(it):signingInput(it)] }
def verifySigning = tasks.register('requireReleaseSigning') {
    doLast {
        def missing = signingKeys.findAll { !sign[it] }
        if (missing) throw new GradleException("Release signing requires: " + missing.join(', '))
    }
}
android {
    namespace 'dev.nexus.localclient'
    compileSdk 36
    ndkVersion '28.2.13676358'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { compose true; buildConfig true }
    testBuildType = providers.gradleProperty('nexusTestRelease').isPresent() ? 'release' : 'debug'
    signingConfigs {
        release {
            if (sign.NEXUS_KEYSTORE) storeFile file(sign.NEXUS_KEYSTORE)
            storePassword sign.NEXUS_KEYSTORE_PASSWORD
            keyAlias sign.NEXUS_KEY_ALIAS
            keyPassword sign.NEXUS_KEY_PASSWORD
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-test-api.pro'
        }
    }
    // GitHub downloads are slow from mainland China; compressing the ~66 MB of native code
    // roughly halves the APK at the cost of extracting the libraries once at install.
    packaging { jniLibs { excludes += ['lib/armeabi-v7a/**', 'lib/x86/**']; useLegacyPackaging true } }
    splits {
        abi { enable true; reset(); include 'arm64-v8a', 'x86_64'; universalApk true }
    }
    if (labAar) {
        sourceSets.androidTest.java.srcDir('src/v2AndroidTest/java')
    }
    sourceSets.main.jniLibs.srcDir(layout.buildDirectory.dir('nexusJni'))
    sourceSets.main.jniLibs.srcDir(layout.buildDirectory.dir('shoesJni'))
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('shoesNotices'))
    defaultConfig {
        applicationId labAar ? 'dev.nexus.lab.m0' : 'dev.nexus.localclient'
        testInstrumentationRunner 'dev.nexus.localclient.CatalogCheck'
        minSdk 26
        targetSdk 36
        versionCode numericVersion
        versionName publicVersion
        def epoch = providers.environmentVariable('SOURCE_DATE_EPOCH').orNull
        def built = epoch ? java.time.Instant.ofEpochSecond(epoch.toLong()) : java.time.Instant.now()
        buildConfigField 'String', 'BUILT_AT', '"' + built.toString() + '"'

    }
}
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    if (variant.buildType == 'release') variant.applicationId.set(labAar ? 'dev.nexus.lab.m0.release' : 'dev.nexus.android')
    variant.outputs.each { output ->
        def abi = output.filters.find { it.filterType.name() == 'ABI' }?.identifier
        if (variant.buildType == 'release') {
            if (abi == 'x86_64') output.enabled.set(false)
            else output.outputFileName.set("Nexus-${publicVersion}-${abi ? 'arm64' : 'universal'}.apk")
        } else if (abi) output.enabled.set(false)
        else output.outputFileName.set('app-debug.apk')
    }
}
tasks.matching { it.name == 'preReleaseBuild' || it.name == 'validateSigningRelease' }.configureEach { dependsOn verifySigning }

kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }

def engineAar = layout.buildDirectory.file('engines/nexus-v2.aar')
def repoRoot = rootProject.projectDir.parentFile.parentFile
def buildEngine = tasks.register('buildV2Engine', Exec) {
    def script = new File(repoRoot, 'tools/build_v2_aar.py')
    inputs.files(script, new File(repoRoot, 'tools/prepare_v2.py'),
        new File(repoRoot, 'v2/go.mod'), new File(repoRoot, 'v2/go.sum'),
        fileTree(new File(repoRoot, 'v2')) {
            include 'patches/*.patch', 'internal/congestion/**', 'udp/**', 'transport/**', 'proof/**', 'mobile/**', 'enrollment/**'
            exclude '**/*_test.go', '**/testdata/**'
        }, fileTree(new File(repoRoot, 'apps/android/engine/v2vpn')))
    outputs.file(engineAar)
    def source = providers.environmentVariable('NEXUS_LIBXRAY_SOURCE').getOrElse(new File(repoRoot, 'target/libXray').absolutePath)
    environment 'ANDROID_NDK_HOME', android.ndkDirectory.absolutePath
    if (gradle.startParameter.offline) {
        environment 'GOPROXY', 'off'
        environment 'GOSUMDB', 'off'
    }
    commandLine providers.environmentVariable('NEXUS_PYTHON').getOrElse('python'), script, source, engineAar.get().asFile
}
dependencies {
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    if (labAar) implementation files(file(labAar))
    else implementation files(engineAar).builtBy(buildEngine)
    implementation 'com.github.mwiede:jsch:2.28.8'
    implementation 'org.yaml:snakeyaml:2.6'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation platform('androidx.compose:compose-bom:2025.12.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3:1.4.0'
}

def nativeOutput = layout.buildDirectory.dir('nexusJni')
def shoesBuild = tasks.register('buildShoes', Exec) {
    def script = new File(rootProject.projectDir.parentFile.parentFile, 'tools/build_android_shoes.py')
    inputs.file(script)
    def jni = layout.buildDirectory.dir('shoesJni')
    def notices = layout.buildDirectory.dir('shoesNotices')
    outputs.dirs(jni,notices)
    commandLine providers.environmentVariable('NEXUS_PYTHON').getOrElse('python'), script, android.ndkDirectory, jni.get().asFile, notices.get().asFile
}
def rustBuild = tasks.register('buildRust', Exec) {
    def repo = rootProject.projectDir.parentFile.parentFile
    inputs.files(fileTree(new File(repo, 'crates')), new File(repo, 'Cargo.lock'),
        new File(repo, 'Cargo.toml'), new File(repo, 'tools/build_android.py'))
    outputs.dir(nativeOutput)
    commandLine providers.environmentVariable('NEXUS_PYTHON').getOrElse('python'),
        new File(repo, 'tools/build_android.py'), android.ndkDirectory, nativeOutput.get().asFile
}
tasks.named('preBuild').configure { dependsOn rustBuild, shoesBuild; if (!labAar) dependsOn buildEngine }

def adminAssets = tasks.register('prepareNodeAssets', Sync) {
    from(new File(rootProject.projectDir.parentFile.parentFile, 'PRIVACY.md'))
    from(new File(rootProject.projectDir.parentFile.parentFile, 'LICENSE')) { into 'licenses/Nexus' }
    from(new File(rootProject.projectDir.parentFile.parentFile, 'tools')) { include 'node_admin.py', 'install_node.py' }
    from(providers.environmentVariable('NEXUS_LINUX_BINARIES').orElse(layout.buildDirectory.dir('linuxNodes').map { it.asFile.absolutePath })) {
        into 'linux'
        include 'x86_64/nexus-server', 'aarch64/nexus-server'
    }
    into layout.buildDirectory.dir('nodeAssets')
    doLast {
        for (abi in ['x86_64','aarch64']) {
            if (!new File(destinationDir, "linux/$abi/nexus-server").isFile()) throw new GradleException("Missing Linux node for $abi. See docs/ANDROID.md")
        }
    }
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('nodeAssets'))
tasks.named('preBuild').configure { dependsOn adminAssets }

def splitScript = new File(rootProject.projectDir.parentFile.parentFile, 'tools/generate_split_rules.py')
def splitAssets = layout.buildDirectory.dir('splitAssets')
def splitCache = layout.buildDirectory.dir('splitDownloads')
def splitData = tasks.register('generateSplitRules', Exec) {
    inputs.file(splitScript)
    outputs.file(splitAssets.map { it.file('split-rules.txt') })
    commandLine providers.environmentVariable('NEXUS_PYTHON').getOrElse('python'), splitScript,
        splitCache.get().asFile, splitAssets.get().file('split-rules.txt').asFile
}
android.sourceSets.main.assets.srcDir(splitAssets)
tasks.named('preBuild').configure { dependsOn splitData }
