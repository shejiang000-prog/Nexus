<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexus</title><link rel="icon" href="nexus-logo.svg"><link href="style.css" rel="stylesheet"><script src="app.js" defer></script>
</head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3.5v8"/><path d="M6.6 7a7.5 7.5 0 1 0 10.8 0"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M10 11v6M14 11v6M6.5 7l.8 11.2A2 2 0 0 0 9.3 20h5.4a2 2 0 0 0 2-1.8L17.5 7M9.5 7V5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol>
</svg>

<header class="top">
  <div class="brand"><img src="nexus-logo.svg" alt="" width="24" height="24"><span>Nexus</span></div>
  <nav aria-label="主要导航"><a href="#home">连接</a><a href="#nodes">节点</a><a href="#settings">设置</a></nav>
</header>

<main>
<section id="home" aria-labelledby="home-title">
  <h1 id="home-title" class="sr-only" tabindex="-1">连接</h1>
  <form id="connection-form" class="home">
    <div id="hero" class="hero" data-link="idle">
      <button id="toggle" type="submit" class="dial" aria-describedby="status" disabled>
        <span class="dial-ring" aria-hidden="true"></span>
        <span class="dial-core" aria-hidden="true"><svg class="icon"><use href="#i-power"/></svg></span>
        <span id="toggle-label" class="sr-only">连接</span>
      </button>
      <p id="status" role="status">未连接</p>
      <p id="route"><span id="lane"></span><span id="clock"></span></p>
    </div>
    <p id="feedback" role="alert" hidden></p>

    <a id="current" class="row link" href="#nodes">
      <span class="row-text"><b id="current-name">我的 V2 节点</b><small id="current-from"></small></span>
      <svg class="icon chevron"><use href="#i-arrow"/></svg>
    </a>
    <div id="enrollment" hidden>
      <label for="invite" class="sr-only">V2 邀请链接</label>
      <input id="invite" type="password" maxlength="16384" autocomplete="off" spellcheck="false" placeholder="首次使用请粘贴 V2 邀请链接">
    </div>
    <div class="seg" role="radiogroup" aria-label="分流模式">
      <label><input type="radio" name="mode" value="split" checked><span>绕过大陆</span></label>
      <label><input type="radio" name="mode" value="global"><span>全局代理</span></label>
    </div>
  </form>
</section>

<section id="nodes" hidden aria-labelledby="nodes-title">
  <h1 id="nodes-title" class="sr-only" tabindex="-1">节点</h1>
  <p id="selected-hint" class="hint"></p>
  <div class="group">
    <div class="group-head"><span>我的节点</span></div>
    <button type="button" id="pick-v2" class="node" role="radio" aria-checked="false">
      <span class="node-name" id="v2-name">我的 V2 节点</span><span class="badge">V2</span>
      <svg class="icon node-check" aria-hidden="true"><use href="#i-check"/></svg>
    </button>
  </div>
  <div id="sub-groups"></div>
  <p id="sub-feedback" role="status"></p>
  <form id="import-form" class="add" hidden>
    <label for="subscription-url" class="sr-only">订阅或节点链接</label>
    <input type="password" id="subscription-url" maxlength="524288" autocomplete="off" spellcheck="false" placeholder="粘贴订阅地址或节点链接" required>
    <button type="submit" id="add-sub" class="btn primary">添加</button>
  </form>
  <button type="button" id="show-import" class="btn wide"><svg class="icon"><use href="#i-plus"/></svg>添加订阅</button>

  <template id="group-template">
    <div class="group">
      <div class="group-head">
        <span class="group-name"></span><small class="group-meta"></small>
        <button type="button" class="icon-btn refresh" aria-label="刷新订阅"><svg class="icon"><use href="#i-refresh"/></svg></button>
        <button type="button" class="icon-btn delete" aria-label="删除订阅"><svg class="icon"><use href="#i-trash"/></svg></button>
      </div>
      <div class="group-nodes" role="radiogroup"></div>
    </div>
  </template>
  <template id="node-template">
    <button type="button" class="node" role="radio" aria-checked="false">
      <span class="node-name"></span><span class="badge"></span>
      <svg class="icon node-check" aria-hidden="true"><use href="#i-check"/></svg>
    </button>
  </template>
  <dialog id="confirm-sub" aria-labelledby="confirm-sub-title"><h2 id="confirm-sub-title">删除此订阅？</h2><p id="delete-hint"></p>
    <form method="dialog"><button value="cancel" class="btn" autofocus>取消</button><button value="delete" class="btn danger">删除</button></form>
  </dialog>
</section>

<section id="settings" hidden aria-labelledby="settings-title">
  <h1 id="settings-title" class="sr-only" tabindex="-1">设置</h1>
  <div class="list">
    <div class="row"><label for="proxy" class="row-text"><b>系统代理</b><small>浏览器等应用自动走代理</small></label><input type="checkbox" role="switch" id="proxy" checked disabled></div>
    <div class="row"><label for="tun" class="row-text"><b>TUN 模式</b><small id="tun-hint">接管全部网络，需要管理员权限</small></label><input type="checkbox" role="switch" id="tun" aria-describedby="tun-hint" disabled></div>
  </div>
  <div class="list">
    <div class="row"><span class="row-text"><b>本机代理端口</b><small id="ports">连接后显示</small></span></div>
    <div class="row"><span class="row-text"><b>设备身份</b><small id="identity">读取中…</small></span><button id="remove" type="button" class="btn small ghost-danger" hidden>移除</button></div>
    <div class="row"><span class="row-text"><b>软件更新</b><small id="update-feedback">—</small></span><button type="button" id="update-action" class="btn small" disabled>检查更新</button></div>
  </div>
  <div class="about">
    <img src="nexus-logo.svg" alt="" width="40" height="40">
    <b>Nexus</b>
    <small>无需注册 · 密钥只保存在本机 · 不收集任何数据</small>
  </div>
  <dialog id="confirm" aria-labelledby="confirm-title"><h2 id="confirm-title">移除此设备身份？</h2>
    <p>将删除本机的设备密钥和节点记录，再次使用需要新的邀请。</p>
    <form method="dialog"><button value="cancel" class="btn" autofocus>取消</button><button value="remove" class="btn danger">移除</button></form>
  </dialog>
</section>
</main>
</body>
</html>
