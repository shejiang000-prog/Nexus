<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nexus</title><link href="style.css" rel="stylesheet"><script src="app.js" defer></script></head>
<body><aside><div class="brand"><span aria-hidden="true">N</span> Nexus</div><nav aria-label="主要导航"><a href="#home">首页</a><a href="#subscriptions">我的订阅</a><a href="#servers">我的服务器</a><a href="#shared">朋友分享</a></nav></aside>
<main id="content"><section id="home"><h1 tabindex="-1">网络概览</h1>
<div class="connection"><p>当前连接</p><div role="status" aria-atomic="true"><h2 id="status">未连接</h2><p id="route">当前线路 · —</p></div>
<form id="connection-form"><div id="enrollment"><label for="invite">V2 邀请链接</label><input id="invite" type="password" maxlength="16384" autocomplete="off" spellcheck="false" aria-describedby="invite-hint"><p id="invite-hint">首次连接时粘贴邀请，使用已保存的身份时留空。</p></div>
<button id="toggle" type="submit" disabled>连接</button></form>
<p class="endpoints">SOCKS5 · 127.0.0.1:21808　HTTP · 127.0.0.1:21809</p></div>
</section>
<section id="subscriptions" hidden><h1 tabindex="-1">我的订阅</h1><p>桌面版暂未支持导入和管理订阅。</p></section>
<section id="servers" hidden><h1 tabindex="-1">我的服务器</h1><p>桌面版暂未支持管理私人服务器。</p></section>
<section id="shared" hidden><h1 tabindex="-1">朋友分享</h1><p>可在<a href="#home">首页</a>粘贴 V2 邀请链接并连接节点。</p></section></main></body></html>
