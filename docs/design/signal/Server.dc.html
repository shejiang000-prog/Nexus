<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Nexus 我的服务器</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.nx{--bg:#0A0D11;--s1:#12171D;--s2:#1A2129;--line:#263039;--ink:#EEF2F6;--ink2:#A9B4BF;--ink3:#8592A0;--sig:#3EE6A3;--sigText:#3EE6A3;--onSig:#03140C;--sigSoft:rgba(62,230,163,.14);--amber:#FFB547;--danger:#FF7A7A;--dangerSoft:rgba(255,122,122,.14);--scrim:rgba(0,0,0,.62);--nav:rgba(10,13,17,.88);font-family:'Noto Sans SC',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.nx.light{--bg:#F3F5F8;--s1:#FFFFFF;--s2:#E9EDF1;--line:#D8DFE6;--ink:#0A0D11;--ink2:#47525E;--ink3:#5F6B78;--sig:#2BD394;--sigText:#0A7F55;--onSig:#03140C;--sigSoft:rgba(43,211,148,.18);--amber:#9A5B00;--danger:#C42B2B;--dangerSoft:rgba(196,43,43,.10);--scrim:rgba(10,13,17,.42);--nav:rgba(255,255,255,.92)}
.num{font-family:'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
.press{transition:transform .2s cubic-bezier(.2,0,0,1)}
.press:active{transform:scale(.97)}
.scroll{scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes live{0%{box-shadow:0 0 0 0 var(--sigSoft)}100%{box-shadow:0 0 0 8px rgba(0,0,0,0)}}
.in{animation:rise .45s cubic-bezier(.05,.7,.1,1) both}
.live{animation:live 1.8s ease-out infinite}
.dev{transition:opacity .4s}
.dev.revoked{opacity:.55}
.bar{transition:width .6s cubic-bezier(.2,0,0,1)}
.scrim{animation:fade .2s ease-out both}
.sheet{animation:sheet .42s cubic-bezier(.05,.7,.1,1) both}
.cta{box-shadow:0 10px 30px -10px var(--sig)}
</style>
</helmet>
<main class="nx {{themeClass}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg)">
<header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0 20px; height: 58px">
<h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.5px">我的服务器</h1>
<button class="press" aria-label="添加服务器" style="width: 44px; height: 44px; border-radius: 14px; background: var(--s2); display: flex; align-items: center; justify-content: center">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</header>

<div class="scroll" style="position: absolute; top: 72px; left: 0; right: 0; bottom: 80px; overflow-y: auto; padding: 8px 20px 28px; box-sizing: border-box">

<section class="in" style="padding: 18px; border-radius: 24px; background: var(--s1); border: 1px solid var(--line)">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div>
<div style="font-size: 21px; font-weight: 700; line-height: 28px">我的 VPS</div>
<div style="display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 14px; color: var(--ink2)">
<span>新加坡</span><span aria-hidden="true">·</span><span class="num">203.0.113.24</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 15px; background: var(--sigSoft); color: var(--sigText); font-size: 14px; font-weight: 600">
<span class="live" style="width: 8px; height: 8px; border-radius: 4px; background: var(--sig)"></span>运行正常</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 16px">
<div style="padding: 10px 12px; border-radius: 14px; background: var(--s2)">
<div class="num" style="font-size: 22px; font-weight: 600">{{activeCount}}</div>
<div style="font-size: 13px; color: var(--ink2)">在线设备</div></div>
<div style="padding: 10px 12px; border-radius: 14px; background: var(--s2)">
<div style="display: flex; align-items: baseline; gap: 3px"><span class="num" style="font-size: 22px; font-weight: 600">38.2</span><span style="font-size: 13px; color: var(--ink2)">GB</span></div>
<div style="font-size: 13px; color: var(--ink2)">本月流量</div></div>
<div style="padding: 10px 12px; border-radius: 14px; background: var(--s2)">
<div style="display: flex; align-items: baseline; gap: 3px"><span class="num" style="font-size: 22px; font-weight: 600">23</span><span style="font-size: 13px; color: var(--ink2)">天</span></div>
<div style="font-size: 13px; color: var(--ink2)">稳定运行</div></div>
</div>
<div style="display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px; color: var(--ink2)">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
已用本机密钥绑定，管理时不用再输密码
</div>
</section>

<a class="press cta in" href="Invite.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 58px; margin-top: 14px; border-radius: 18px; background: var(--sig); color: var(--onSig); font-size: 17px; font-weight: 700; animation-delay: 60ms">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"></path><path d="M19 8v6M16 11h6"></path></svg>
邀请朋友或我的设备</a>

<div style="display: flex; align-items: baseline; justify-content: space-between; margin: 26px 4px 10px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">已授权设备</h2>
<span class="num" style="font-size: 14px; color: var(--ink2)">{{deviceCount}}</span>
</div>
<div style="border-radius: 20px; background: var(--s1); border: 1px solid var(--line); overflow: hidden">
<sc-for list="{{devices}}" as="d" hint-placeholder-count="4">
<div class="dev in {{d.stateClass}}" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-top: {{d.divider}}; animation-delay: {{d.delay}}">
<span style="width: 40px; height: 40px; border-radius: 13px; background: var(--s2); display: flex; align-items: center; justify-content: center; color: var(--ink2); flex: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"></rect><path d="M11 18.5h2"></path></svg>
</span>
<div style="flex: 1; min-width: 0">
<div style="display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 600; line-height: 22px">{{d.name}}
<sc-if value="{{d.mine}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 600; color: var(--sigText); border: 1px solid var(--sig); border-radius: 6px; padding: 0 5px; line-height: 18px">本机</span></sc-if>
</div>
<div style="font-size: 13px; color: var(--ink2); line-height: 18px">{{d.sub}}</div>
<sc-if value="{{d.hasQuota}}" hint-placeholder-val="{{ false }}">
<div style="height: 4px; border-radius: 2px; background: var(--s2); margin-top: 7px; overflow: hidden"><div class="bar" style="height: 4px; border-radius: 2px; background: var(--sig); width: {{d.pct}}"></div></div>
</sc-if>
</div>
<sc-if value="{{d.canRevoke}}" hint-placeholder-val="{{ true }}">
<button class="press" onClick="{{d.ask}}" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); font-size: 14px; font-weight: 600; color: var(--ink)">撤销</button>
</sc-if>
<sc-if value="{{d.isRevoked}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 14px; font-weight: 500; color: var(--ink2)">已撤销</span>
</sc-if>
</div>
</sc-for>
</div>

<div style="margin: 26px 4px 10px"><h2 style="margin: 0; font-size: 17px; font-weight: 600">维护</h2></div>
<div style="border-radius: 20px; background: var(--s1); border: 1px solid var(--line); overflow: hidden">
<sc-for list="{{tools}}" as="t" hint-placeholder-count="3">
<button class="press" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 10px 14px; box-sizing: border-box; text-align: left; border-top: {{t.divider}}">
<span style="flex: 1">
<span style="display: block; font-size: 16px; font-weight: 600; line-height: 22px">{{t.title}}</span>
<span style="display: block; font-size: 13px; color: var(--ink2); line-height: 18px">{{t.sub}}</span>
</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</sc-for>
</div>
</div>

<nav aria-label="主导航" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--nav); border-top: 1px solid var(--line); backdrop-filter: blur(16px)">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 10px; color: var(--ink2)">
<span style="width: 60px; height: 32px; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4.5"></circle><circle cx="12" cy="12" r="1" fill="currentColor"></circle></svg></span>
<span style="font-size: 13px; font-weight: 500">连接</span></a>
<a href="Nodes.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 10px; color: var(--ink2)">
<span style="width: 60px; height: 32px; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg></span>
<span style="font-size: 13px; font-weight: 500">节点</span></a>
<a href="Server.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 10px">
<span style="width: 60px; height: 32px; border-radius: 16px; background: var(--sigSoft); display: flex; align-items: center; justify-content: center; color: var(--sigText)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="7" rx="2"></rect><rect x="4" y="13" width="16" height="7" rx="2"></rect><path d="M8 7.5h.01M8 16.5h.01"></path></svg></span>
<span style="font-size: 13px; font-weight: 600">我的服务器</span></a>
</nav>

<sc-if value="{{confirming}}" hint-placeholder-val="{{ false }}">
<div class="scrim" style="position: absolute; inset: 0; background: var(--scrim)">
<button aria-label="取消" onClick="{{cancel}}" style="position: absolute; inset: 0; width: 100%; height: 100%"></button>
<section class="sheet" role="dialog" aria-modal="true" aria-label="撤销设备" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 28px; border-radius: 28px 28px 0 0; background: var(--s1)">
<div aria-hidden="true" style="width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 18px"></div>
<div style="width: 52px; height: 52px; border-radius: 16px; background: var(--dangerSoft); color: var(--danger); display: flex; align-items: center; justify-content: center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M5.6 5.6l12.8 12.8"></path></svg>
</div>
<h2 style="margin: 16px 0 6px; font-size: 22px; font-weight: 700">撤销「{{targetName}}」？</h2>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: var(--ink2)">这台设备会立刻断开，之后也无法再连接你的服务器。需要时可以重新邀请。</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 22px">
<button class="press" onClick="{{cancel}}" style="height: 54px; border-radius: 16px; background: var(--s2); font-size: 16px; font-weight: 600">保留</button>
<button class="press" onClick="{{confirm}}" style="height: 54px; border-radius: 16px; background: var(--danger); color: #FFFFFF; font-size: 16px; font-weight: 700">撤销</button>
</div>
</section>
</div>
</sc-if>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { revoked: { old: true }, target: null }; }
  renderVals() {
    const s = this.state;
    const list = [
      { id: 'me', name: 'Galaxy S24 Ultra', mine: true, sub: '正在使用 · 本月 12.6 GB' },
      { id: 'mi', name: '小米 14', sub: '朋友 · 还剩 5 天 · 3.1 GB · 不限流量' },
      { id: 'px', name: 'Pixel 8', sub: '朋友 · 2 天前使用 · 8.4 / 20 GB', pct: '42%' },
      { id: 'old', name: '旧手机', sub: '11 月 2 日撤销' }
    ];
    const devices = list.map((d, i) => {
      const gone = !!s.revoked[d.id];
      return {
        name: d.name, mine: !!d.mine, sub: gone && d.id !== 'old' ? '刚刚撤销' : d.sub,
        hasQuota: !!d.pct && !gone, pct: d.pct || '0%',
        canRevoke: !gone && !d.mine, isRevoked: gone,
        stateClass: gone ? 'revoked' : '', divider: i ? '1px solid var(--line)' : '0', delay: (90 + i * 35) + 'ms',
        ask: () => this.setState({ target: d })
      };
    });
    const active = list.filter((d) => !s.revoked[d.id]).length;
    return {
      themeClass: (this.props.theme || 'dark') === 'light' ? 'light' : '',
      devices, activeCount: String(active), deviceCount: active + ' 台可用',
      tools: [
        { title: '更新服务器程序', sub: '已是最新版本', divider: '0' },
        { title: '备份与迁移', sub: '换服务器时保留所有授权', divider: '1px solid var(--line)' },
        { title: '高级设置', sub: '端口、DNS、移除部署', divider: '1px solid var(--line)' }
      ],
      confirming: !!s.target, targetName: s.target ? s.target.name : '',
      cancel: () => this.setState({ target: null }),
      confirm: () => this.setState({ revoked: Object.assign({}, s.revoked, { [s.target.id]: true }), target: null })
    };
  }
}
</script>
</body>
</html>
