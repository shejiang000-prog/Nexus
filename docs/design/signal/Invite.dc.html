<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Nexus 邀请</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.nx{--bg:#0A0D11;--s1:#12171D;--s2:#1A2129;--line:#263039;--ink:#EEF2F6;--ink2:#A9B4BF;--ink3:#8592A0;--sig:#3EE6A3;--sigText:#3EE6A3;--onSig:#03140C;--sigSoft:rgba(62,230,163,.14);--scrim:rgba(0,0,0,.62);font-family:'Noto Sans SC',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.nx.light{--bg:#F3F5F8;--s1:#FFFFFF;--s2:#E9EDF1;--line:#D8DFE6;--ink:#0A0D11;--ink2:#47525E;--ink3:#5F6B78;--sig:#2BD394;--sigText:#0A7F55;--onSig:#03140C;--sigSoft:rgba(43,211,148,.18);--scrim:rgba(10,13,17,.42)}
.num{font-family:'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
.press{transition:transform .2s cubic-bezier(.2,0,0,1),background-color .2s,border-color .2s}
.press:active{transform:scale(.96)}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes qpop{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
@keyframes toast{0%{opacity:0;transform:translateY(-12px) scale(.98)}12%{opacity:1;transform:none}88%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}
@keyframes swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scrim{animation:fade .24s ease-out both}
.sheet{animation:sheet .5s cubic-bezier(.05,.7,.1,1) both}
.qm{transform-box:fill-box;transform-origin:center;animation:qpop .46s cubic-bezier(.2,1.5,.4,1) both}
.toast{animation:toast 3.2s cubic-bezier(.2,0,0,1) both}
.chipv{display:inline-block;animation:swap .28s cubic-bezier(.05,.7,.1,1) both}
.cta{box-shadow:0 10px 30px -10px var(--sig)}
</style>
</helmet>
<main class="nx {{themeClass}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg)">
<div aria-hidden="true" style="padding: 14px 20px 0">
<div style="height: 44px; display: flex; align-items: center; font-size: 30px; font-weight: 700">我的服务器</div>
<div style="height: 196px; margin-top: 22px; border-radius: 24px; background: var(--s1); border: 1px solid var(--line)"></div>
<div style="height: 58px; margin-top: 14px; border-radius: 18px; background: var(--sig)"></div>
</div>

<div class="scrim" style="position: absolute; inset: 0; background: var(--scrim)"></div>

<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="invite-title" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 20px 26px; border-radius: 30px 30px 0 0; background: var(--s1); box-shadow: 0 -20px 60px rgba(0,0,0,.35)">
<div aria-hidden="true" style="width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px"></div>
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div>
<h2 id="invite-title" style="margin: 0; font-size: 23px; font-weight: 700; line-height: 30px">邀请到「我的 VPS」</h2>
<p style="margin: 4px 0 0; font-size: 15px; line-height: 22px; color: var(--ink2)">对方用 Nexus 扫码，或收到消息后打开 Nexus</p>
</div>
<a class="press" href="Server.dc.html" aria-label="关闭" style="width: 44px; height: 44px; margin: -4px -8px 0 0; border-radius: 22px; background: var(--s2); display: flex; align-items: center; justify-content: center; flex: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
</div>

<div style="display: flex; justify-content: center; margin-top: 18px">
<div style="position: relative; width: 224px; height: 224px; padding: 14px; box-sizing: border-box; border-radius: 26px; background: #FFFFFF; box-shadow: 0 0 0 1px var(--line)">
<svg role="img" aria-label="邀请二维码" width="196" height="196" viewBox="-1 -1 27 27" style="display: block">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="0">
<rect class="qm" x="{{c.x}}" y="{{c.y}}" width="1.02" height="1.02" rx="0.28" fill="#0A0D11" style="animation-delay: {{c.d}}"></rect>
</sc-for>
<sc-for list="{{finders}}" as="f" hint-placeholder-count="3">
<g class="qm" style="animation-delay: {{f.d}}">
<rect x="{{f.x}}" y="{{f.y}}" width="7" height="7" rx="1.9" fill="#0A0D11"></rect>
<rect x="{{f.x1}}" y="{{f.y1}}" width="5" height="5" rx="1.2" fill="#FFFFFF"></rect>
<rect x="{{f.x2}}" y="{{f.y2}}" width="3" height="3" rx="0.8" fill="#0A0D11"></rect>
</g>
</sc-for>
</svg>
<div style="position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 14px; background: #0A0D11; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 5px #FFFFFF">
<svg width="24" height="24" viewBox="0 0 40 40" aria-hidden="true"><path d="M0 34 L12 5.2 L21.2 5.2 L28.4 20.4 L34.8 5.2 L40 5.2 L28 34.8 L20.4 34.8 L12.8 18.8 L6.8 34 Z" fill="#3EE6A3"></path></svg>
</div>
</div>
</div>

<div style="margin-top: 20px">
<div style="font-size: 14px; color: var(--ink2); margin: 0 2px 8px">限制（点按修改）</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button class="press" onClick="{{nextDays}}" aria-label="有效期，当前 {{days}}" style="height: 56px; border-radius: 16px; background: var(--s2); border: 1px solid var(--line); text-align: center">
<span style="display: block; font-size: 12px; color: var(--ink2); line-height: 16px">有效期</span>
<span class="chipv" style="font-size: 16px; font-weight: 600; line-height: 22px">{{days}}</span>
</button>
<button class="press" onClick="{{nextCount}}" aria-label="设备数，当前 {{count}}" style="height: 56px; border-radius: 16px; background: var(--s2); border: 1px solid var(--line); text-align: center">
<span style="display: block; font-size: 12px; color: var(--ink2); line-height: 16px">设备</span>
<span class="chipv" style="font-size: 16px; font-weight: 600; line-height: 22px">{{count}}</span>
</button>
<button class="press" onClick="{{nextQuota}}" aria-label="流量，当前 {{quota}}" style="height: 56px; border-radius: 16px; background: var(--s2); border: 1px solid var(--line); text-align: center">
<span style="display: block; font-size: 12px; color: var(--ink2); line-height: 16px">流量</span>
<span class="chipv" style="font-size: 16px; font-weight: 600; line-height: 22px">{{quota}}</span>
</button>
</div>
</div>

<button class="press cta" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 58px; margin-top: 18px; border-radius: 18px; background: var(--sig); color: var(--onSig); font-size: 17px; font-weight: 700">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"></path><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg>
发送邀请</button>
<button class="press" onClick="{{copy}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 54px; margin-top: 10px; border-radius: 18px; border: 1.5px solid var(--line); font-size: 16px; font-weight: 600">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
复制消息（发微信用）</button>
<p style="margin: 12px 0 0; text-align: center; font-size: 13px; line-height: 18px; color: var(--ink2)">{{footnote}}</p>
</section>

<sc-if value="{{copied}}" hint-placeholder-val="{{ false }}">
<div class="toast" role="status" style="position: absolute; left: 16px; right: 16px; top: 18px; display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 18px; background: var(--ink); color: var(--bg); box-shadow: 0 16px 40px rgba(0,0,0,.35)">
<span style="width: 28px; height: 28px; border-radius: 14px; background: var(--sig); color: var(--onSig); display: flex; align-items: center; justify-content: center; flex: none">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<span style="font-size: 15px; line-height: 21px; font-weight: 500">已复制。去微信粘贴发送，对方复制后打开 Nexus 就会自动识别。</span>
</div>
</sc-if>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { d: 1, c: 0, q: 0, copied: 0 }; }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const s = this.state;
    const DAYS = ['1 天', '7 天', '30 天', '长期'];
    const COUNT = ['1 台', '2 台', '5 台'];
    const QUOTA = ['不限', '10 GB', '50 GB'];
    const N = 25;
    let seed = 7 + s.d * 31 + s.c * 7 + s.q * 3;
    const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
    const inFinder = (x, y) => (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
    const inLogo = (x, y) => x >= 9 && x <= 15 && y >= 9 && y <= 15;
    const cells = [];
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      if (inFinder(x, y) || inLogo(x, y)) continue;
      const timing = (y === 6 || x === 6) ? ((x + y) % 2 === 0) : rnd() < 0.47;
      if (timing) cells.push({ x, y, d: Math.round(Math.hypot(x - 12, y - 12) * 22) + 'ms' });
    }
    const finders = [[0, 0], [N - 7, 0], [0, N - 7]].map(([x, y]) => ({ x, y, x1: x + 1, y1: y + 1, x2: x + 2, y2: y + 2, d: '360ms' }));
    const days = DAYS[s.d];
    return {
      themeClass: (this.props.theme || 'dark') === 'light' ? 'light' : '',
      cells, finders,
      days, count: COUNT[s.c], quota: QUOTA[s.q],
      footnote: '邀请在 ' + (s.d === 0 ? '1 天' : '7 天') + '内可领取 · 随时可在设备列表里撤销',
      copied: s.copied > 0,
      nextDays: () => this.setState({ d: (s.d + 1) % DAYS.length }),
      nextCount: () => this.setState({ c: (s.c + 1) % COUNT.length }),
      nextQuota: () => this.setState({ q: (s.q + 1) % QUOTA.length }),
      copy: () => {
        clearTimeout(this._t);
        this.setState({ copied: 0 }, () => this.setState({ copied: s.copied + 1 }));
        this._t = setTimeout(() => this.setState({ copied: 0 }), 3200);
      }
    };
  }
}
</script>
</body>
</html>
