<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Nexus 收到邀请</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.nx{--bg:#0A0D11;--s1:#12171D;--s2:#1A2129;--line:#263039;--ink:#EEF2F6;--ink2:#A9B4BF;--ink3:#8592A0;--sig:#3EE6A3;--sigText:#3EE6A3;--onSig:#03140C;--sigSoft:rgba(62,230,163,.14);--glow:rgba(62,230,163,.22);font-family:'Noto Sans SC',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.nx.light{--bg:#F3F5F8;--s1:#FFFFFF;--s2:#E9EDF1;--line:#D8DFE6;--ink:#0A0D11;--ink2:#47525E;--ink3:#5F6B78;--sig:#2BD394;--sigText:#0A7F55;--onSig:#03140C;--sigSoft:rgba(43,211,148,.18);--glow:rgba(43,211,148,.24)}
.num{font-family:'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button,input{font:inherit;color:inherit;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.press{transition:transform .2s cubic-bezier(.2,0,0,1)}
.press:active{transform:scale(.97)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes burst{from{transform:translate(0,0) scale(.3);opacity:1}to{opacity:0}}
@keyframes halo{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.9);opacity:0}}
.in{animation:rise .55s cubic-bezier(.05,.7,.1,1) both}
.link{stroke-dasharray:4 8;animation:flow .9s linear infinite;transition:stroke .4s}
.st-claiming .link{animation-duration:.35s;stroke:var(--sig)}
.st-done .link{stroke-dasharray:none;stroke:var(--sig);animation:none}
.node{transition:background-color .45s,color .45s,box-shadow .45s}
.st-done .node.me{background:var(--sig);color:var(--onSig);box-shadow:0 12px 40px var(--glow)}
.midcheck{transform:scale(0)}
.st-done .midcheck{animation:pop .5s cubic-bezier(.2,1.4,.4,1) .1s both}
.spinner{animation:spin .8s linear infinite;transform-origin:center}
.tick{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .4s cubic-bezier(.2,0,0,1) .15s forwards}
.p{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:2px;animation:burst .9s cubic-bezier(.05,.7,.1,1) .12s both}
.halo{position:absolute;inset:0;border-radius:50%;border:2px solid var(--sig);animation:halo 1s cubic-bezier(.05,.7,.1,1) both}
.field{transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:var(--sig);box-shadow:0 0 0 4px var(--sigSoft)}
.cta{box-shadow:0 10px 30px -10px var(--sig)}
</style>
</helmet>
<main class="nx {{themeClass}} st-{{stage}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg)">
<header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 0 20px; height: 58px">
<span style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px; background: var(--s2); font-size: 13px; color: var(--ink2)">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
从剪贴板识别</span>
<a class="press" href="Main.dc.html" aria-label="关闭" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: var(--ink2)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</header>

<section aria-hidden="true" style="position: relative; height: 150px; margin: 18px 40px 0">
<svg width="310" height="150" viewBox="0 0 310 150" style="position: absolute; inset: 0">
<line class="link" x1="86" y1="75" x2="224" y2="75" stroke="var(--ink3)" stroke-width="2.5" stroke-linecap="round"></line>
</svg>
<div class="node" style="position: absolute; left: 14px; top: 39px; width: 72px; height: 72px; border-radius: 24px; background: var(--s2); color: var(--ink); display: flex; align-items: center; justify-content: center">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="7" rx="2"></rect><rect x="4" y="13" width="16" height="7" rx="2"></rect><path d="M8 7.5h.01M8 16.5h.01"></path></svg>
</div>
<div class="node me" style="position: absolute; right: 14px; top: 39px; width: 72px; height: 72px; border-radius: 24px; background: var(--s2); color: var(--ink); display: flex; align-items: center; justify-content: center">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"></rect><path d="M11 18.5h2"></path></svg>
</div>
<div class="midcheck" style="position: absolute; left: 137px; top: 57px; width: 36px; height: 36px; border-radius: 18px; background: var(--sig); color: var(--onSig); display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</div>
</section>

<section class="in" style="padding: 0 24px; margin-top: 18px; text-align: center">
<h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 36px; letter-spacing: -0.3px">{{title}}</h1>
<p style="margin: 8px 0 0; font-size: 16px; line-height: 24px; color: var(--ink2)">{{sub}}</p>
</section>

<section class="in" style="margin: 24px 20px 0; border-radius: 20px; background: var(--s1); border: 1px solid var(--line); animation-delay: 70ms">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 16px; height: 52px">
<span style="font-size: 15px; color: var(--ink2)">服务器</span><span style="font-size: 16px; font-weight: 600">我的 VPS · 新加坡</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 16px; height: 52px; border-top: 1px solid var(--line)">
<span style="font-size: 15px; color: var(--ink2)">可用时间</span><span style="font-size: 16px; font-weight: 600">7 天</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 16px; height: 52px; border-top: 1px solid var(--line)">
<span style="font-size: 15px; color: var(--ink2)">流量</span><span style="font-size: 16px; font-weight: 600">不限</span></div>
</section>

<section class="in" style="margin: 16px 20px 0; animation-delay: 120ms">
<label for="device-name" style="display: block; font-size: 14px; color: var(--ink2); margin: 0 4px 8px">本机名称（对方会在设备列表里看到）</label>
<div class="field" style="display: flex; align-items: center; height: 54px; padding: 0 16px; border-radius: 16px; background: var(--s1); border: 1.5px solid var(--line)">
<input id="device-name" defaultValue="Galaxy S24 Ultra" style="flex: 1; min-width: 0; font-size: 16px; font-weight: 500; outline: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path></svg>
</div>
</section>

<div style="position: absolute; left: 20px; right: 20px; bottom: 30px">
<sc-if value="{{isReady}}" hint-placeholder-val="{{ true }}">
<button class="press cta" onClick="{{accept}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 58px; border-radius: 18px; background: var(--sig); color: var(--onSig); font-size: 17px; font-weight: 700">接受并连接</button>
</sc-if>
<sc-if value="{{isClaiming}}" hint-placeholder-val="{{ false }}">
<button disabled aria-busy="true" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 58px; border-radius: 18px; background: var(--sig); color: var(--onSig); font-size: 17px; font-weight: 700; cursor: default">
<svg class="spinner" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".25" stroke-width="3"></circle><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path></svg>
正在加入</button>
</sc-if>
<sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
<div style="position: relative">
<sc-for list="{{particles}}" as="p" hint-placeholder-count="0">
<span class="p" style="background: {{p.c}}; transform: translate({{p.x}}px, {{p.y}}px) rotate({{p.r}}deg)"></span>
</sc-for>
<a class="press" href="Main.dc.html" style="position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 58px; border-radius: 18px; background: var(--sig); color: var(--onSig); font-size: 17px; font-weight: 700; overflow: visible">
<span class="halo" style="border-radius: 18px"></span>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="tick" d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
已连接，开始使用</a>
</div>
</sc-if>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; margin-top: 6px; font-size: 15px; font-weight: 500; color: var(--ink2)">{{secondary}}</a>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"stage":{"editor":"enum","options":["ready","claiming","done"],"default":"ready"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = {}; }
  componentDidUpdate(prev) { if (prev.stage !== this.props.stage) this.setState({ stage: this.props.stage }); }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const stage = this.state.stage || this.props.stage || 'ready';
    const colors = ['var(--sig)', 'var(--ink)', 'var(--sig)', 'var(--ink3)'];
    const particles = [];
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * Math.PI * 2 + 0.2;
      const r = 70 + (i % 3) * 26;
      particles.push({ x: Math.round(Math.cos(a) * r * 1.6), y: Math.round(Math.sin(a) * r * 0.55 - 10), r: i * 37, c: colors[i % 4] });
    }
    return {
      themeClass: (this.props.theme || 'dark') === 'light' ? 'light' : '',
      stage,
      isReady: stage === 'ready', isClaiming: stage === 'claiming', isDone: stage === 'done',
      title: stage === 'done' ? '加入成功' : stage === 'claiming' ? '正在加入…' : '收到一个邀请',
      sub: stage === 'done' ? '已自动设为当前节点，并开始保护你的网络' : '朋友邀请你使用一台私人服务器，接受后会自动连接',
      secondary: stage === 'ready' ? '不是我的邀请' : '',
      particles,
      accept: () => {
        this.setState({ stage: 'claiming' });
        this._t = setTimeout(() => this.setState({ stage: 'done' }), 1700);
      }
    };
  }
}
</script>
</body>
</html>
