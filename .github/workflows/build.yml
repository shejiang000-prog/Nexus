name: Nexus bootstrap
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: rustup toolchain install 1.100.0 --profile minimal --component clippy,rustfmt
      - run: cargo +1.100.0 fmt --all -- --check
      - run: cargo +1.100.0 clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +1.100.0 build --locked --workspace && cargo +1.100.0 test --locked --workspace
      - run: python3 tools/test_tunnel.py
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21'}
      - run: rustup toolchain install 1.100.0 --profile minimal --target aarch64-linux-android,x86_64-linux-android
      - run: sdkmanager "platforms;android-36" "ndk;28.2.13676358" "build-tools;35.0.0"
      - run: bash gradlew :app:assembleDebug
        working-directory: apps/android
        env: {RUSTUP_TOOLCHAIN: '1.100.0', NEXUS_PYTHON: python3}
  desktop-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: cargo +1.100.0 build --locked --manifest-path apps/desktop/Cargo.toml
