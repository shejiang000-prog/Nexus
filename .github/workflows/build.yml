name: Nexus bootstrap
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: rustup toolchain install 1.100.0 --profile minimal --component clippy,rustfmt
      - run: cargo +1.100.0 fmt --all -- --check
      - run: cargo +1.100.0 clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +1.100.0 build --locked --workspace --lib --bins --examples && cargo +1.100.0 test --locked --workspace
      - run: python3 tools/test_tunnel.py
  android:
    runs-on: ubuntu-24.04
    env: {GOTOOLCHAIN: go1.27.4}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Check out pinned libXray sources for the combined AAR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: XTLS/libXray
          ref: 5a0f7d8d1c28b34afb5727b04b26a10f6dbac7e3
          path: target/libXray
          persist-credentials: false
      - name: Prepare pinned Go mobile tools
        run: |
          go install golang.org/x/mobile/cmd/{gomobile,gobind}@v0.0.0-20261011034528-197770444867
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21'}
      - run: rustup toolchain install 1.100.0 --profile minimal --target aarch64-linux-android,x86_64-linux-android
      - run: cargo +1.100.0 install cargo-ndk --version 4.1.2 --locked
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "ndk;28.2.13676358" "build-tools;35.0.0"'
      - run: bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest :vpnprobe:assembleDebug
        working-directory: apps/android
        env: {RUSTUP_TOOLCHAIN: '1.100.0', NEXUS_PYTHON: python3}
  desktop-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: cargo +1.100.0 build --locked --manifest-path apps/desktop/Cargo.toml
  v2-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: go1.27.4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: python3 tools/prepare_v2.py "$RUNNER_TEMP/nexus-v2" --android
      - working-directory: v2
        run: |
          export GOFLAGS="-modfile=$RUNNER_TEMP/nexus-v2/v2.mod -mod=readonly"
          go build -o "$RUNNER_TEMP/nexus-node" ./cmd/nexus-node
          go vet ./...
          NEXUS_NODE_TEST_BINARY="$RUNNER_TEMP/nexus-node" go test -race ./...
