[package]
name = "nexus-android"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
etherparse = "0.16"
futures-util = { version = "0.3", features = ["sink"] }
